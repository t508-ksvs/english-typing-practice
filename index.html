<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文打字格式練習 (English Typing Practice) - 技高專案升級版</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts: Noto Sans TC & Times New Roman -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
 
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f3f4f6;
    }
    /* 強制練習區使用 Times New Roman */
    .typing-font {
      font-family: 'Times New Roman', Times, serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 擴充題庫：保留原經典題，並加入高職職場情境與劇本規格題
    const levels = [
      {
        id: 1,
        title: "Level 1: Expressing Likes (表達喜好)",
        theme: "生活基礎",
        sentence: "I really like Christmas because we can exchange gifts.",
        hint: "注意：句首大寫、because 前沒有逗號、句尾有句點。"
      },
      {
        id: 2,
        title: "Level 2: Making an Invitation (提出邀約)",
        theme: "社交對話",
        sentence: "Would you like to come to my party next Friday?",
        hint: "注意：這是問句，最後要用問號 (?)。Friday 是專有名詞要大寫。"
      },
      {
        id: 3,
        title: "Level 3: Complex Sentence (標點與縮寫)",
        theme: "標點防呆",
        sentence: "I am sorry, but I can't go to the movies with you.",
        hint: "挑戰題：注意逗號 (,) 後面要空一格，縮寫符號 (') 不要按錯。"
      },
      {
        id: 4,
        title: "Level 4: Cafe Ordering (餐飲點餐專題)",
        theme: "影音專案對白",
        sentence: "Good morning! What would you like to order, tea or coffee?",
        hint: "專案題：驚嘆號 (!) 與問號 (?) 前緊貼前字，標點後「空一格」；tea 後有逗號。"
      },
      {
        id: 5,
        title: "Level 5: Auto Repair (汽車修護與估價)",
        theme: "技高專業情境",
        sentence: "There is a sharp nail near the sidewall, so we need to replace the tire.",
        hint: "專業題：注意逗號 (,) 後面加上連接詞 so，避免「一逗到底 (Comma Splice)」語病。"
      },
      {
        id: 6,
        title: "Level 6: Script Line Format (劇本角色台詞)",
        theme: "Google Docs 共編標準格式",
        sentence: "Mechanic (Tom): Don't worry! We can give you a free estimate.",
        hint: "終極挑戰：角色與姓名括號格式、冒號 (:) 後空一格、縮寫 (') 與驚嘆號 (!) 空格！"
      }
    ];

    function App() {
      const [currentLevelIndex, setCurrentLevelIndex] = useState(0);
      const [userInput, setUserInput] = useState("");
      const [feedback, setFeedback] = useState({ type: "", message: "" });
      const [isCompleted, setIsCompleted] = useState(false);
      const [showSuccessModal, setShowSuccessModal] = useState(false);
      
      // 學生資訊 (用於生成認證卡)
      const [studentClass, setStudentClass] = useState("");
      const [studentSeat, setStudentSeat] = useState("");
      const [studentName, setStudentName] = useState("");
      const [completedTime, setCompletedTime] = useState("");
      const [copiedCert, setCopiedCert] = useState(false);

      const inputRef = useRef(null);
      const currentLevel = levels[currentLevelIndex];

      // 自動聚焦輸入框
      useEffect(() => {
        if (inputRef.current) {
          inputRef.current.focus();
        }
      }, [currentLevelIndex]);

      // 檢查邏輯 (大幅增強：全形字偵測、標點空格、一逗到底、大小寫提示)
      const checkAnswer = () => {
        const target = currentLevel.sentence;
        const input = userInput;

        // 1. 完全正確比對 (支援直/彎單引號、Dont/Don't 與驚嘆號後大小寫寬容)
        const normalizeForCompare = (str) => {
          return str
            .trim()
            .replace(/[’‘`]/g, "'")
            .replace(/don't/gi, "don't")
            .replace(/dont/gi, "don't")
            .replace(/!\s+we/gi, "! We");
        };

        if (input === target || normalizeForCompare(input) === normalizeForCompare(target)) {
          // 觸發彩帶特效
          if (typeof confetti === "function") {
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          }
          setFeedback({ type: "success", message: "🎉 完全正確！標點、空格與大小寫完美無瑕！(Correct!)" });
          setShowSuccessModal(true);
          return;
        }

        // 2. 智慧錯誤偵測 (由嚴重到輕微依序過濾)

        // (A) 檢查：全形字元偵測 (包含全形字母、全形數字、全形標點符號)
        const fullWidthRegex = /[！，。？；：【】（）“”‘’Ａ-Ｚａ-ｚ０-９]/;
        if (fullWidthRegex.test(input)) {
          setFeedback({
            type: "error",
            message: "❌ 偵測到「全形字元」！請切換為英數半形輸入。（Windows 用戶若誤觸請按 Shift + Space 切回半形；平板請切至純英文鍵盤）"
          });
          return;
        }

        // (B) 檢查：標點符號前面多出空格 (e.g., " ?" or " ,")
        if (/ [,.?!;:]/.test(input)) {
          setFeedback({
            type: "error",
            message: "❌ 標點符號前面「不能」有空格！請緊緊貼著前一個單字的最後一個字母。"
          });
          return;
        }

        // (C) 檢查：標點符號後面漏掉空格 (e.g., ",but" or ".Next" or ":Don't")
        if (/[,.?!;:](?=[a-zA-Z0-9])/.test(input)) {
          setFeedback({
            type: "error",
            message: "❌ 標點符號後面「必須空一格」再打下一個字！請檢查逗號、句號或冒號後面是否有敲 Space 空白鍵。"
          });
          return;
        }

        // (D) 檢查：連續多個空格 (e.g., "  ")
        if (/  /.test(input)) {
          setFeedback({
            type: "error",
            message: "❌ 單字之間只要「空一格」就好，請勿按多次空白鍵。"
          });
          return;
        }

        // (E) 檢查：大小寫不符 (利用轉小寫比對)
        if (normalizeForCompare(input).toLowerCase() === normalizeForCompare(target).toLowerCase()) {
          setFeedback({
            type: "error",
            message: "⚠️ 內容很接近了！但有「大小寫」不符。請檢查句首字母、專有名詞（如 Friday）或角色名稱。"
          });
          return;
        }

        // (F) 檢查：未打完 (長度不足)
        if (input.length < target.length * 0.75) {
          setFeedback({
            type: "warning",
            message: "💪 加油，請把完整的句子打完再點檢查喔。"
          });
          return;
        }

        // (G) 檢查：其他拼字或漏字錯誤
        setFeedback({
          type: "error",
          message: "🤔 還有部分單字拼錯或符號不相符喔，請仔細對照上方的黃色目標句子！"
        });
      };

      const handleNextLevel = () => {
        setShowSuccessModal(false);
        setFeedback({ type: "", message: "" });
        setUserInput("");
        
        if (currentLevelIndex < levels.length - 1) {
          setCurrentLevelIndex(prev => prev + 1);
        } else {
          // 全部完成，記錄完成時間並放彩帶
          const now = new Date();
          const timeStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
          setCompletedTime(timeStr);
          setIsCompleted(true);
          if (typeof confetti === "function") {
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
          }
        }
      };

      const handleRestart = () => {
        setCurrentLevelIndex(0);
        setIsCompleted(false);
        setUserInput("");
        setFeedback({ type: "", message: "" });
        setCopiedCert(false);
      };

      // 產生完成證明代碼
      const getVerificationCode = () => {
        const raw = `${studentClass}-${studentSeat}-${studentName}-${completedTime}`;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
          hash = (hash << 5) - hash + raw.charCodeAt(i);
          hash |= 0;
        }
        return `TYP-${Math.abs(hash).toString(16).toUpperCase().padStart(6, '0')}`;
      };

      // 複製完成證明到剪貼簿 (便於在 Google Classroom 貼上)
      const copyCertificateText = () => {
        const text = `【英文打字格式練習 - 完成認證卡】
班級：${studentClass || '未填'}
座號：${studentSeat || '未填'}
姓名：${studentName || '未填'}
完成關卡：全數通過 (${levels.length}/${levels.length} 關)
完成時間：${completedTime}
認證驗證碼：${getVerificationCode()}

★ 我已完全掌握英數半形、標點後空一格、S+V 句型與 Times New Roman 格式規範！`;
        navigator.clipboard.writeText(text).then(() => {
          setCopiedCert(true);
          setTimeout(() => setCopiedCert(false), 2500);
        });
      };

      // ==================== 成功完成全部挑戰畫面 ====================
      if (isCompleted) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 p-4 py-10">
            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 max-w-xl w-full text-center border-t-8 border-indigo-600">
              <div className="text-6xl mb-3">🏆</div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-2">恭喜完成打字通關檢定！</h1>
              <p className="text-sm sm:text-base text-gray-600 mb-6">
                你已掌握技高英語文件核心規範：<br/>
                <span className="font-bold text-indigo-600">英數半形 • 標點後空一格 • 拒絕一逗到底 • Times New Roman</span>
              </p>

              {/* 學生資訊輸入與成果卡 (便於 Google Classroom 繳交認證) */}
              <div className="bg-slate-50 border-2 border-indigo-100 rounded-2xl p-5 mb-6 text-left shadow-inner">
                <div className="flex items-center justify-between border-b border-gray-200 pb-2 mb-3">
                  <span className="text-xs font-bold text-indigo-700 uppercase tracking-wider">🎓 學生自主完成證明卡</span>
                  <span className="text-xs text-gray-400">{completedTime}</span>
                </div>
                
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">班級 (Class)</label>
                    <input 
                      type="text" 
                      placeholder="例：汽二甲" 
                      value={studentClass}
                      onChange={(e) => setStudentClass(e.target.value)}
                      className="w-full text-xs p-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-indigo-500 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">座號 (No.)</label>
                    <input 
                      type="text" 
                      placeholder="例：15" 
                      value={studentSeat}
                      onChange={(e) => setStudentSeat(e.target.value)}
                      className="w-full text-xs p-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-indigo-500 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">姓名 (Name)</label>
                    <input 
                      type="text" 
                      placeholder="例：王小明" 
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      className="w-full text-xs p-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-indigo-500 outline-none"
                    />
                  </div>
                </div>

                <div className="bg-white p-3 rounded-xl border border-gray-200 text-xs text-gray-600 space-y-1">
                  <div className="flex justify-between">
                    <span>檢定成績：</span>
                    <span className="font-bold text-green-600">100% 通過 (全 6 關達成)</span>
                  </div>
                  <div className="flex justify-between">
                    <span>認證防偽碼：</span>
                    <span className="font-mono font-bold text-indigo-600">{getVerificationCode()}</span>
                  </div>
                </div>

                <div className="mt-3 flex flex-col sm:flex-row gap-2">
                  <button 
                    onClick={copyCertificateText}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition duration-200 shadow flex items-center justify-center gap-1.5"
                  >
                    <span>{copiedCert ? "✅ 已複製認證文字！" : "📋 複製完成證明（貼至 GC 留言）"}</span>
                  </button>
                </div>
              </div>

              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 text-xs text-amber-800 text-left mb-6 leading-relaxed">
                <strong>💡 Google Classroom 繳交指引：</strong><br/>
                請將上方認證卡<strong>截圖</strong>（或點擊複製文字），至 Google Classroom 作業回條中貼上繳交，即可完成本次打字前置檢定！現在可以開始進行 Google Docs 劇本共編囉！
              </div>

              <button 
                onClick={handleRestart}
                className="text-gray-500 hover:text-gray-700 text-xs font-semibold underline transition"
              >
                再練習一次 (Restart)
              </button>
            </div>
          </div>
        );
      }

      // ==================== 練習主畫面 ====================
      return (
        <div className="min-h-screen bg-gray-100 py-8 px-4 flex flex-col items-center">
          
          {/* Header */}
          <div className="max-w-3xl w-full mb-6 text-center">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-1 flex items-center justify-center gap-2">
              English Typing Practice ⌨️
            </h1>
            <p className="text-sm text-gray-600">高職英語專案前置檢定：請依照「標準英文文件格式」鍵入下方句子。</p>
            <div className="mt-2 flex flex-wrap justify-center gap-2 text-xs text-indigo-600 font-medium">
              <span className="bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">英數半形</span>
              <span className="bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">標點後空一格</span>
              <span className="bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">拒絕一逗到底</span>
              <span className="bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">Times New Roman</span>
            </div>
          </div>

          {/* Progress Bar */}
          <div className="max-w-3xl w-full bg-gray-200 rounded-full h-3 mb-6 shadow-inner">
            <div 
              className="bg-indigo-600 h-3 rounded-full transition-all duration-500 shadow" 
              style={{ width: `${((currentLevelIndex) / levels.length) * 100}%` }}
            ></div>
          </div>

          {/* Main Practice Card */}
          <div className="bg-white rounded-2xl shadow-xl p-5 sm:p-8 max-w-3xl w-full border-t-4 border-indigo-600">
            
            {/* Card Header & Level Info */}
            <div className="flex flex-wrap justify-between items-center gap-2 mb-5">
              <div className="flex items-center gap-2">
                <span className="bg-indigo-100 text-indigo-800 text-xs sm:text-sm font-bold px-3 py-1 rounded-full">
                  {currentLevel.title}
                </span>
                <span className="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded">
                  {currentLevel.theme}
                </span>
              </div>
              <span className="text-gray-500 text-xs sm:text-sm font-semibold">
                進度：{currentLevelIndex + 1} / {levels.length}
              </span>
            </div>

            {/* Target Sentence Display Box */}
            <div className="mb-6 p-4 sm:p-6 bg-yellow-50 border-l-4 border-yellow-400 rounded-r-xl shadow-sm">
              <p className="text-gray-500 text-xs mb-1.5 font-sans font-medium flex items-center justify-between">
                <span>請精準鍵入下方目標句子 (Target Sentence)：</span>
                <span className="text-[11px] text-yellow-700 bg-yellow-100/80 px-2 py-0.5 rounded">注意大小寫與標點空格</span>
              </p>
              <p className="typing-font text-xl sm:text-2xl md:text-3xl text-gray-900 leading-relaxed tracking-wide select-none">
                {currentLevel.sentence}
              </p>
            </div>

            {/* Input Textarea Area */}
            <div className="mb-4">
              <textarea
                ref={inputRef}
                value={userInput}
                onChange={(e) => {
                  setUserInput(e.target.value);
                  setFeedback({ type: "", message: "" });
                }}
                onKeyDown={(e) => {
                  // 按 Enter 直接觸發檢查
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    checkAnswer();
                  }
                }}
                placeholder="請在此處打字...（打完可直接按 Enter 或點擊下方檢查）"
                className="typing-font w-full p-4 text-lg sm:text-2xl border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition resize-none h-28 sm:h-32 shadow-inner"
                spellCheck="false"
                autoComplete="off"
                autoCapitalize="off"
              ></textarea>
              <div className="mt-1.5 flex justify-between items-center text-xs text-gray-400">
                <span>載具提示：Windows 誤變全形請按 <kbd className="px-1 py-0.5 bg-gray-200 text-gray-700 rounded font-mono">Shift+Space</kbd> 切回</span>
                <span>字體標準: Times New Roman 12 pt</span>
              </div>
            </div>

            {/* Hints & Feedback Display */}
            <div className="min-h-[72px] mb-6">
              {feedback.message ? (
                <div className={`p-3.5 sm:p-4 rounded-xl flex items-start text-xs sm:text-sm font-medium shadow-sm transition-all ${
                  feedback.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 
                  feedback.type === 'warning' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 
                  'bg-emerald-50 text-emerald-800 border border-emerald-200'
                }`}>
                  <span className="mr-2 text-base flex-shrink-0">
                    {feedback.type === 'error' ? '⚠️' : feedback.type === 'warning' ? '💡' : '✅'}
                  </span>
                  <span className="leading-relaxed">{feedback.message}</span>
                </div>
              ) : (
                <div className="p-3.5 sm:p-4 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 text-xs sm:text-sm flex items-start">
                  <span className="mr-2 text-base flex-shrink-0">💡</span>
                  <span className="leading-relaxed"><strong>打字提示：</strong>{currentLevel.hint}</span>
                </div>
              )}
            </div>

            {/* Action Buttons */}
            <div className="flex justify-between items-center pt-2 border-t border-gray-100">
              <span className="text-xs text-gray-400 hidden sm:inline">
                按鍵秘訣：標點符號請緊接著前一字母，後面請敲擊一次 Spacebar 空格
              </span>
              <button
                onClick={checkAnswer}
                className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2 transform active:scale-95"
              >
                <span>檢查送出 (Check)</span>
                <span>↵</span>
              </button>
            </div>

          </div>

          {/* Success Modal Overlay (單關過關彈窗) */}
          {showSuccessModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 px-4">
              <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-sm w-full text-center transform transition-all scale-100 border-4 border-emerald-500">
                <div className="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-emerald-100 mb-4">
                  <svg className="h-10 w-10 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"></path>
                  </svg>
                </div>
                <h3 className="text-2xl font-black text-gray-900 mb-1">Excellent! 🎉</h3>
                <p className="text-sm text-gray-600 mb-6">這句打得非常標準！大小寫與空格完全正確。</p>
                <button
                  onClick={handleNextLevel}
                  className="w-full inline-flex justify-center items-center rounded-xl border border-transparent shadow-lg px-5 py-3 bg-emerald-600 text-base font-bold text-white hover:bg-emerald-700 focus:outline-none transition active:scale-95"
                >
                  {currentLevelIndex < levels.length - 1 ? "下一題 (Next Level) →" : "領取通關證書 🏆"}
                </button>
              </div>
            </div>
          )}

          {/* Footer Note */}
          <footer className="mt-8 text-center text-xs text-gray-400">
            高雄高工 英語科教學團隊 • 技高英語專案打字格式練習系統
